
services:

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-my-org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-web_metrics}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:12.2.0-17282025910-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-my-org}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-web_metrics}
    depends_on:
      - influxdb

  cron-runner:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: cron-runner
    restart: unless-stopped
    command: ["npm", "run", "start-runner"]
    environment:
      - NODE_ENV=production
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-my-org}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-web_metrics}
    depends_on:
      - influxdb
volumes:
  influxdb-data:
  grafana-data:
